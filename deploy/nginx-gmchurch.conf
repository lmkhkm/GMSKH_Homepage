# 광명교회 홈페이지 nginx 설정
#
# 설치 위치: /etc/nginx/sites-available/gmchurch
# 활성화:    ln -s /etc/nginx/sites-available/gmchurch /etc/nginx/sites-enabled/
#
# 이 파일은 HTTP(80) 기준으로만 작성되어 있습니다.
# certbot 을 실행하면 인증서 설정과 HTTPS 리다이렉트를 여기에 자동으로 추가합니다.
# (먼저 HTTP 로 도메인이 정상 응답해야 인증서 발급이 됩니다)

# 파일 종류에 따라 캐시 정책을 다르게 줍니다.
# HTML 은 항상 재검증 → 내용을 고치면 바로 반영됩니다.
# CSS/JS 는 GitHub Actions 가 ?v=<커밋SHA> 를 붙여주므로 길게 캐싱해도
# 새 버전이 곧바로 내려갑니다.
map $sent_http_content_type $gmchurch_cache {
    default                    "public, max-age=2592000";           # 이미지·폰트 30일
    "~*text/html"              "public, max-age=0, must-revalidate"; # HTML 즉시 반영
    "~*text/css"               "public, max-age=604800";             # CSS 7일
    "~*javascript"             "public, max-age=604800";             # JS  7일
    "~*application/xml"        "public, max-age=0, must-revalidate"; # sitemap.xml
    "~*text/plain"             "public, max-age=0, must-revalidate"; # robots.txt
}

# www 로 들어온 방문자를 www 없는 주소로 넘깁니다.
# 사이트의 canonical 주소가 www 없는 쪽이라, 두 주소가 같은 내용을 그대로
# 보여주면 검색엔진이 중복 페이지로 취급합니다.
server {
    listen 80;
    server_name www.DOMAIN_PLACEHOLDER;

    # 인증서 발급·갱신 요청은 리다이렉트하지 않고 통과시켜야 합니다
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gmchurch;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 $scheme://DOMAIN_PLACEHOLDER$request_uri;
    }
}

server {
    listen 80;
    # 네이버 클라우드 서버는 IPv6 가 없는 경우가 많아 IPv6 리스닝은 넣지 않았습니다.
    # (IPv6 가 없는데 listen [::]:80 을 쓰면 nginx 가 아예 기동되지 않습니다)

    # ↓↓↓ 도메인을 여기에 넣으세요 (setup-server.sh 가 자동으로 채워줍니다)
    server_name DOMAIN_PLACEHOLDER;

    root /var/www/gmchurch;
    index index.html;

    # CSS·JS 안에 한글이 있어도 깨지지 않도록 charset 을 명시합니다
    charset utf-8;
    charset_types text/css text/xml text/plain application/javascript
                  application/json image/svg+xml;

    server_tokens off;

    # Let's Encrypt 인증서 발급·갱신용 경로 (아래 dotfile 차단보다 우선합니다)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gmchurch;
        default_type "text/plain";
        allow all;
    }

    # 숨김 파일 차단 (.git 등이 문서 루트에 들어가는 사고를 대비한 이중 안전장치)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 보안 헤더 + 캐시 헤더
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Cache-Control            $gmchurch_cache                always;

    # 압축
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml
                      application/javascript application/json
                      application/xml application/xml+rss
                      image/svg+xml;

    # /worship 처럼 .html 을 빼고 들어와도 열리게 합니다
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    access_log /var/log/nginx/gmchurch.access.log;
    error_log  /var/log/nginx/gmchurch.error.log;
}
